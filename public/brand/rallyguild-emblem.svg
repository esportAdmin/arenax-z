<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RallyGuild emblem</title>
  <desc id="desc">Hexagonal RG emblem with cyan and violet gradients for the RallyGuild product brand.</desc>
